<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Community Medicine Rotation Scheduler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<style>
:root{
  --paper:#F5F7F6; --ink:#22313A; --muted:#5C6B72; --line:#DCE3E0; --cell:#FFFFFF;
  --teal:#0F6B68; --teal-ink:#0B4E4C; --teal-soft:#E4EFEE; --teal-deep:#0A3C3A;
  --amber:#8A5A00; --amber-soft:#F6EEDC;
  --hard:#A93B2A; --hard-soft:#F7E7E3; --warn:#8A6A16; --warn-soft:#F5EDD6;
  --r0:#2F5FB3; --r0s:#E8EEF9; --r1:#B5541C; --r1s:#F8ECE4; --r2:#6C3FA0; --r2s:#EFE8F7;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
h1,h2,h3,.disp{font-family:"Archivo","Segoe UI",system-ui,sans-serif}
button{font-family:inherit}
#root{min-height:100vh;display:flex;flex-direction:column}

/* banner */
.banner{background:var(--teal-deep);color:#EAF3F2;padding:18px 26px 16px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 28px}
.banner .kicker{font-family:"Archivo";font-weight:600;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#9CC4C1;margin-bottom:4px}
.banner h1{font-size:26px;font-weight:800;letter-spacing:.01em;margin:0;line-height:1.1}
.banner .blockcard{margin-left:auto;text-align:right}
.banner .blocknum{font-family:"Archivo";font-weight:800;font-size:22px;letter-spacing:.04em}
.banner .blockdates{font-size:13px;color:#BFD8D6}
.stepper{display:flex;gap:2px;background:var(--teal);padding:0 26px}
.step{padding:10px 18px;color:#CFE3E1;font-family:"Archivo";font-weight:600;font-size:13px;letter-spacing:.04em;border:none;background:transparent;cursor:pointer;border-bottom:3px solid transparent}
.step.on{color:#fff;border-bottom-color:#F2C14E}
.step:disabled{opacity:.45;cursor:default}
.main{flex:1;padding:22px 26px;max-width:1500px;width:100%;margin:0 auto}

/* upload */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:18px}
.card{background:var(--cell);border:1px solid var(--line);border-radius:10px;padding:18px}
.card h3{margin:0 0 4px;font-size:16px}
.card .sub{color:var(--muted);font-size:13px;margin-bottom:12px}
.drop{border:2px dashed var(--line);border-radius:8px;padding:22px;text-align:center;color:var(--muted);cursor:pointer;transition:all .15s}
.drop:hover,.drop.over{border-color:var(--teal);background:var(--teal-soft);color:var(--teal-ink)}
.filemeta{margin-top:12px;font-size:13px}
.filemeta .ok{color:var(--teal-ink);font-weight:600}
.filemeta .err{color:var(--hard);font-weight:600}
.issue{border-left:3px solid var(--warn);background:var(--warn-soft);padding:8px 10px;border-radius:0 6px 6px 0;margin:8px 0;font-size:13px}
.issue.hard{border-left-color:var(--hard);background:var(--hard-soft)}
.facchips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.facchip{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--teal-soft);color:var(--teal-ink);font-weight:600}
.facchip.miss{background:var(--warn-soft);color:var(--warn)}

/* residents */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}
.rchip{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--cell);cursor:pointer;font-weight:600;font-size:14px;text-align:left;transition:all .1s}
.rchip:hover{border-color:var(--teal)}
.rchip.sel{color:#fff;border-color:transparent}
.pickrow{display:flex;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}

/* toolbar */
.toolbar{position:sticky;top:0;z-index:40;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--paper);padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:16px}
.btn{border:1px solid var(--line);background:var(--cell);color:var(--ink);padding:8px 16px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;transition:all .12s}
.btn:hover{border-color:var(--teal);color:var(--teal-ink)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:hover{background:var(--teal-ink)}
.btn:disabled{opacity:.5;cursor:default}
.wbadge{margin-left:auto;display:flex;gap:8px}
.wpill{font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px}
.wpill.hard{background:var(--hard);color:#fff}
.wpill.soft{background:var(--warn-soft);color:var(--warn)}
.wpill.clean{background:var(--teal-soft);color:var(--teal-ink)}

/* layout */
.schedwrap{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start}
@media(max-width:1080px){.schedwrap{grid-template-columns:1fr}}

/* week tables */
.wk{margin-bottom:22px}
.wk h3{font-size:15px;color:var(--teal-ink);margin:0 0 8px;letter-spacing:.03em}
table.grid{width:100%;border-collapse:collapse;background:var(--cell);table-layout:fixed}
table.grid th{background:#E9F0EF;color:var(--teal-ink);font-family:"Archivo";font-size:12px;letter-spacing:.05em;padding:7px 6px;border:1px solid var(--line)}
table.grid th.side{width:44px}
table.grid td{border:1px solid var(--line);vertical-align:top;padding:5px;min-height:70px;height:84px;transition:background .1s}
table.grid td.side{background:#F0F4F3;text-align:center;font-family:"Archivo";font-weight:700;color:var(--teal-ink);font-size:12px;width:44px}
td.dropok{background:var(--teal-soft);outline:2px dashed var(--teal);outline-offset:-3px}
td.lockedcell{background:repeating-linear-gradient(-45deg,#F2F4F3 0 8px,#EDF0EF 8px 16px);color:var(--muted);font-size:12px;text-align:center;vertical-align:middle}
.busytags{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
.busytag{font-size:10px;color:#7A8A90;background:#F0F3F2;border-radius:4px;padding:1px 5px;white-space:nowrap}
.bscdot{float:right;font-size:10px;color:#9AA9AE}
.bscdot b{color:var(--teal)}

/* chips */
.chip{position:relative;border-radius:6px;padding:4px 18px 4px 7px;margin:3px 0;font-size:11.5px;line-height:1.3;cursor:grab;border:1px solid transparent;font-weight:600}
.chip:active{cursor:grabbing}
.chip .x{position:absolute;top:2px;right:3px;border:none;background:transparent;color:inherit;opacity:.55;cursor:pointer;font-size:11px;padding:1px 3px;border-radius:4px}
.chip .x:hover{opacity:1;background:rgba(0,0,0,.12)}
.chip.kgroup{background:var(--teal);color:#fff}
.chip.kfacspecial{background:#C9922A;color:#fff}
.chip.kallres,.chip.ktogetherpref{background:var(--teal-soft);color:var(--teal-ink);border-color:#BAD3D1}
.chip.kper{background:var(--cell);border-color:var(--line);border-left-width:4px}
.chip.kfmclabel{background:var(--amber-soft);color:var(--amber);border:1px dashed #D9B25E}
.chip.kfiller{background:transparent;border:1px dashed #C9D2CF;color:#93A1A6;font-weight:500}
.chip a{color:inherit;text-decoration:underline;font-weight:500}
.chip .sub{font-weight:500;opacity:.85;display:block}
.chip.conflict{box-shadow:0 0 0 2px var(--hard)}

/* side panel */
.panel{background:var(--cell);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:16px}
.panel h4{margin:0 0 8px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-family:"Archivo"}
.wlist{margin:0;padding:0;list-style:none;font-size:12.5px}
.wlist li{border-left:3px solid var(--hard);background:var(--hard-soft);padding:7px 9px;border-radius:0 6px 6px 0;margin-bottom:7px}
.wlist.soft li{border-left-color:var(--warn);background:var(--warn-soft)}
.tray{min-height:54px;border:2px dashed var(--line);border-radius:8px;padding:6px}
.tray.dropok{border-color:var(--teal);background:var(--teal-soft)}
.tray .empty{color:var(--muted);font-size:12px;text-align:center;padding:10px 0}
.legend{font-size:12px}
.legend .row{display:flex;align-items:center;gap:8px;margin:5px 0}
.sw{width:14px;height:14px;border-radius:4px;flex:0 0 auto}

/* toast + modal */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;font-size:13.5px;box-shadow:0 8px 30px rgba(0,0,0,.25);z-index:100;max-width:640px}
.toast.warn{background:var(--hard)}
.overlay{position:fixed;inset:0;background:rgba(20,32,36,.5);display:flex;align-items:center;justify-content:center;z-index:90;padding:20px}
.modal{background:var(--cell);border-radius:12px;max-width:640px;width:100%;max-height:80vh;overflow:auto;padding:22px}
.modal h3{margin:0 0 12px}
.modal .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}

@media print{
  .banner,.stepper,.toolbar,.panel,.no-print{display:none !important}
  .schedwrap{display:block}
  body{background:#fff}
  .main{padding:0;max-width:none}
  .wk{break-inside:avoid}
  .chip{cursor:default}
  .chip .x{display:none}
}
@page{size:landscape;margin:10mm}
</style>
</head>
<body>
<div id="root"></div>
<script>/* Community Medicine Scheduler — core engine (no DOM). Works in browser (window.CMCore) and Node (module.exports). */
(function (root, factory) {
  if (typeof module === "object" && module.exports) module.exports = factory();
  else root.CMCore = factory();
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";

  /* ---------------- utilities ---------------- */
  const MONTHS = { JAN:0, FEB:1, MAR:2, APR:3, MAY:4, JUN:5, JUL:6, AUG:7, SEP:8, SEPT:8, OCT:9, NOV:10, DEC:11 };
  const norm = (v) => (v == null ? "" : String(v).replace(/ /g, " ").replace(/\s+/g, " ").trim());
  const up = (v) => norm(v).toUpperCase();
  const lc = (v) => norm(v).toLowerCase();
  const utc = (y, m, d) => new Date(Date.UTC(y, m, d, 12, 0, 0));
  const addDays = (dt, n) => new Date(dt.getTime() + n * 86400000);
  const iso = (dt) => dt.toISOString().slice(0, 10);
  const fmtShort = (dt) => dt.toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });
  const fmtLong = (dt) => dt.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric", timeZone: "UTC" });
  const DOWS = ["Mon", "Tue", "Wed", "Thu", "Fri"];
  const skey = (dateIso, ampm) => dateIso + "|" + ampm;

  /* ---------------- block header ---------------- */
  function parseBlockHeader(grid) {
    let joined = "";
    for (let r = 0; r < Math.min(grid.length, 6); r++) joined += " " + (grid[r] || []).map(up).join(" ");
    const m = joined.match(/BLOCK\s*#?\s*(\d+)\s*:?\s*([A-Z]{3,4})\.?\s*(\d{1,2})\s*(?:TO|–|—|-)\s*([A-Z]{3,4})\.?\s*(\d{1,2})\s*,?\s*(\d{4})/);
    if (!m) return null;
    const [, num, m1, d1, m2, d2, yr] = m;
    if (!(m1 in MONTHS) || !(m2 in MONTHS)) return null;
    const endYear = parseInt(yr, 10);
    const startYear = MONTHS[m1] > MONTHS[m2] ? endYear - 1 : endYear;
    return {
      blockNum: parseInt(num, 10),
      start: utc(startYear, MONTHS[m1], parseInt(d1, 10)),
      end: utc(endYear, MONTHS[m2], parseInt(d2, 10)),
    };
  }

  function findHeaderRows(grid) {
    const out = [];
    for (let r = 0; r < grid.length; r++) {
      const cells = (grid[r] || []).map(up);
      if (cells.includes("MON") && (cells.includes("TUES") || cells.includes("TUE"))) out.push(r);
    }
    return out;
  }

  const DAY_RANGE = (d) => { const b = d * 6 + 1; return [b, b + 4]; }; // cols for Mon..Fri

  function looksLegend(row) {
    const t = (row || []).map(norm).join(" | ");
    return /,\s*(M\.?D\.?|D\.?O\.?|PH\.?D\.?)(\b|$)/i.test(t) || /ADMINISTRATIVE TIME|LONG ACTING CONTRACEPTIVE/i.test(t);
  }

  /* ---------------- faculty workbook ---------------- */
  function parseFaculty(grid) {
    const issues = [];
    const block = parseBlockHeader(grid);
    if (!block) return { error: "Could not find the block title (e.g. “BLOCK #2: JUL 26 to AUG 22, 2026”) in the faculty file." };
    const headers = findHeaderRows(grid);
    if (!headers.length) return { error: "Could not find any week header rows (MON / TUES / WED…) in the faculty file." };
    const map = {}; // slotKey -> { INITIALS: [ACT,...] }
    const weeks = headers.length;

    headers.forEach((h, w) => {
      // date validation: col0 = Sunday day-of-month
      const sunNum = parseFloat(norm((grid[h] || [])[0]));
      const expSun = addDays(block.start, w * 7);
      if (Number.isFinite(sunNum) && expSun.getUTCDate() !== sunNum) {
        issues.push({ level: "hard", code: "date-mismatch", msg: `Faculty file: week ${w + 1} header shows day ${sunNum}, but counting from the block start it should be ${expSun.getUTCDate()} (${fmtShort(expSun)}). Check the file dates.` });
      }
      const next = headers[w + 1] != null ? headers[w + 1] : grid.length;
      // divider = first row whose col0 starts with GLD
      let div = -1;
      for (let r = h + 1; r < next; r++) { if (up((grid[r] || [])[0]).startsWith("GLD")) { div = r; break; } }
      if (div === -1) { issues.push({ level: "soft", code: "no-divider", msg: `Faculty file: week ${w + 1} — could not find the AM/PM divider row; assuming an even split.` }); div = Math.floor((h + next) / 2); }
      const sections = [ ["AM", h + 1, div], ["PM", div + 1, next - 1] ];
      for (const [ampm, r0, r1] of sections) {
        for (let r = r0; r <= r1 && r < grid.length; r++) {
          const row = grid[r] || [];
          if (looksLegend(row)) break;
          for (let d = 0; d < 5; d++) {
            const date = addDays(block.start, w * 7 + d + 1);
            if (date > block.end) continue;
            const key = skey(iso(date), ampm);
            const [c0, c1] = DAY_RANGE(d);
            const vals = [];
            for (let c = c0; c <= c1; c++) { const t = norm(row[c]); if (t) vals.push(t); }
            for (let i = 0; i < vals.length; i += 2) {
              const who = up(vals[i]);
              const act = up(vals[i + 1] || "");
              if (!who) continue;
              (map[key] = map[key] || {});
              (map[key][who] = map[key][who] || []).push(act);
            }
          }
        }
      }
    });
    const found = new Set();
    Object.values(map).forEach((m) => Object.keys(m).forEach((k) => found.add(k)));
    return { block, weeks, map, facultyFound: [...found], issues };
  }

  /* ---------------- resident workbook ---------------- */
  const NAME_STOP = new Set(["US", "AA", "NHR", "ADMIN", "PTO", "OFF", "COLPO", "HV"]);
  function splitEntry(t) {
    const parts = norm(t).split(/\s*[-–—]\s*/);
    return { name: norm(parts[0]), suffix: up(parts.slice(1).join("-")), raw: norm(t) };
  }

  function parseResidents(grid) {
    const issues = [];
    const block = parseBlockHeader(grid);
    if (!block) return { error: "Could not find the block title (e.g. “BLOCK #2: JUL 26 - AUG 22, 2026”) in the resident file." };
    const headers = findHeaderRows(grid);
    if (!headers.length) return { error: "Could not find any week header rows (MON / TUES / WED…) in the resident file." };
    const entries = {};      // slotKey -> [{name,suffix,raw}]
    const dayBlock = {};     // dateIso -> Set(lower names)  (PTO / Conference — whole day)
    const halfBlock = {};    // slotKey -> Set(lower names)  (NHR — half day)
    const wedLabel = {};     // weekIndex -> 'ACADEMIC AFTERNOON' | 'PROCEDURE CONFERENCE'
    const rosterCount = {};

    headers.forEach((h, w) => {
      const sunNum = parseFloat(norm((grid[h] || [])[0]));
      const expSun = addDays(block.start, w * 7);
      if (Number.isFinite(sunNum) && expSun.getUTCDate() !== sunNum) {
        issues.push({ level: "hard", code: "date-mismatch", msg: `Resident file: week ${w + 1} header shows day ${sunNum}, but counting from the block start it should be ${expSun.getUTCDate()} (${fmtShort(expSun)}). Check the file dates.` });
      }
      const next = headers[w + 1] != null ? headers[w + 1] : grid.length;
      let marker = -1;
      for (let r = h + 1; r < next; r++) {
        const t = (grid[r] || []).map(up).join(" ");
        if (t.includes("ACADEMIC AFTERNOON") || t.includes("PROCEDURE CONFERENCE")) { marker = r; wedLabel[w] = t.includes("PROCEDURE") ? "Procedure Conference" : "Academic Afternoon"; break; }
      }
      if (marker === -1) { issues.push({ level: "soft", code: "no-marker", msg: `Resident file: week ${w + 1} — no “Academic Afternoon” marker found; assuming an even AM/PM split.` }); marker = Math.floor((h + next) / 2); wedLabel[w] = "Academic Afternoon"; }
      const sections = [ ["AM", h + 1, marker - 1], ["PM", marker, next - 1] ];
      for (const [ampm, r0, r1] of sections) {
        for (let r = r0; r <= r1 && r < grid.length; r++) {
          const row = grid[r] || [];
          if (looksLegend(row)) continue;
          for (let d = 0; d < 5; d++) {
            const date = addDays(block.start, w * 7 + d + 1);
            if (date > block.end) continue;
            const dIso = iso(date);
            const key = skey(dIso, ampm);
            const [c0, c1] = DAY_RANGE(d);
            for (let c = c0; c <= c1; c++) {
              const t = norm(row[c]);
              if (!t) continue;
              const U = up(t);
              if (U.includes("ACADEMIC AFTERNOON") || U.includes("PROCEDURE CONFERENCE")) continue;
              if (/^(PTO|CONFERENCE)\b/i.test(t)) {
                const names = t.split(":").slice(1).join(":").split(",").map(norm).filter(Boolean);
                (dayBlock[dIso] = dayBlock[dIso] || new Set());
                names.forEach((n) => dayBlock[dIso].add(lc(n)));
                continue;
              }
              if (/^NHR\b/i.test(t)) {
                const names = t.split(":").slice(1).join(":").split(",").map(norm).filter(Boolean);
                (halfBlock[key] = halfBlock[key] || new Set());
                names.forEach((n) => halfBlock[key].add(lc(n)));
                continue;
              }
              if (/^EXCUSED/i.test(t)) continue;
              const e = splitEntry(t);
              if (!e.name || NAME_STOP.has(up(e.name))) continue;
              (entries[key] = entries[key] || []).push(e);
              rosterCount[e.name] = (rosterCount[e.name] || 0) + 1;
            }
          }
        }
      }
    });
    const roster = Object.keys(rosterCount).sort((a, b) => a.localeCompare(b));
    return { block, weeks: headers.length, entries, dayBlock, halfBlock, wedLabel, roster, issues };
  }

  /* ---------------- combined model ---------------- */
  function buildModel(facGrid, resGrid) {
    const fac = parseFaculty(facGrid);
    if (fac.error) return { error: fac.error, which: "faculty" };
    const res = parseResidents(resGrid);
    if (res.error) return { error: res.error, which: "resident" };
    const issues = [...fac.issues, ...res.issues];
    if (iso(fac.block.start) !== iso(res.block.start) || iso(fac.block.end) !== iso(res.block.end)) {
      issues.push({ level: "hard", code: "block-mismatch", msg: `The two files cover different dates: faculty file ${fmtShort(fac.block.start)} – ${fmtShort(fac.block.end)}, resident file ${fmtShort(res.block.start)} – ${fmtShort(res.block.end)}. Make sure both files are for the same block.` });
    }
    if (fac.block.blockNum !== res.block.blockNum) {
      issues.push({ level: "hard", code: "block-mismatch", msg: `Block numbers differ: faculty file is Block #${fac.block.blockNum}, resident file is Block #${res.block.blockNum}.` });
    }
    for (const code of ["BSC", "KAR", "SKB"]) {
      if (!fac.facultyFound.includes(code)) issues.push({ level: "soft", code: "fac-missing", msg: `${code} was never found on the faculty grid — ${code === "BSC" ? "Dr. Carroll" : code === "KAR" ? "Dr. Ray" : "Dr. Beach"} will be treated as available all block. Double-check the faculty file.` });
    }
    const block = fac.block;
    const weeks = Math.max(fac.weeks, res.weeks);
    const slots = [];
    for (let w = 0; w < weeks; w++) {
      for (let d = 0; d < 5; d++) {
        const date = addDays(block.start, w * 7 + d + 1);
        if (date > block.end || date < block.start) continue;
        for (const ampm of ["AM", "PM"]) {
          const locked = d === 2 && ampm === "PM";
          slots.push({ key: skey(iso(date), ampm), dateIso: iso(date), date, ampm, dow: d, week: w, locked, lockedLabel: locked ? (res.wedLabel[w] || "Academic Afternoon") : null });
        }
      }
    }
    return { block, weeks, slots, fac, res, issues };
  }

  /* ---------------- availability ---------------- */
  function facultyActs(model, code, slotKey) { return (model.fac.map[slotKey] || {})[code] || []; }
  function bscFree(model, slotKey) {
    const ampm = slotKey.split("|")[1];
    const acts = facultyActs(model, "BSC", slotKey);
    if (!acts.length) return true;
    return acts.every((a) => a === "ADMIN" || (ampm === "PM" && a === "BRONZE"));
  }
  function facFree(model, code, slotKey) {
    if (code === "BSC") return bscFree(model, slotKey);
    const acts = facultyActs(model, code, slotKey);
    return !acts.length || acts.every((a) => a === "ADMIN");
  }
  function residentEntries(model, name, slotKey) {
    const n = lc(name);
    return (model.res.entries[slotKey] || []).filter((e) => lc(e.name) === n);
  }
  function residentBusy(model, name, slotKey) {
    const n = lc(name);
    const dIso = slotKey.split("|")[0];
    if (model.res.dayBlock[dIso] && model.res.dayBlock[dIso].has(n)) return true;
    if (model.res.halfBlock[slotKey] && model.res.halfBlock[slotKey].has(n)) return true;
    return residentEntries(model, name, slotKey).length > 0;
  }
  function residentBusyText(model, name, slotKey) {
    const bits = [];
    const dIso = slotKey.split("|")[0];
    if (model.res.dayBlock[dIso] && model.res.dayBlock[dIso].has(lc(name))) bits.push("PTO/Conf");
    if (model.res.halfBlock[slotKey] && model.res.halfBlock[slotKey].has(lc(name))) bits.push("NHR");
    residentEntries(model, name, slotKey).forEach((e) => bits.push(e.suffix ? e.suffix : "FMC"));
    return bits.join(", ");
  }
  function residentFmcLabelable(model, name, slotKey) {
    return residentEntries(model, name, slotKey).some((e) => e.suffix === "" || e.suffix === "WI");
  }

  /* ---------------- session catalog ---------------- */
  const LINKS = {
    exposure: { t: "Taking an Exposure History (ATSDR)", u: "http://www.atsdr.cdc.gov/csem/exphistory/docs/exposure_history.pdf" },
    vac1: { t: "Intro to Vaccines (video)", u: "https://www.youtube.com/watch?v=z0sRa7cIgK4" },
    vac2: { t: "AAFP Fall Immunization Recs (video)", u: "https://www.youtube.com/watch?v=JGtp1xawzr4" },
    ama: { t: "AMA Steps Forward: Stress First Aid module", u: "https://edhub.ama-assn.org/steps-forward/module/2779767" },
  };

  const DEFS = [
    { id: "g1", kind: "group", hours: 4, title: "Group: Intro to Community Medicine — curriculum & schedule review; intro to Occupational Medicine", lockedTo: "first" },
    { id: "g2", kind: "group", hours: 4, title: "Group: Physician Wellness; Occ Med case example (workbook)", links: ["exposure"] },
    { id: "g3", kind: "group", hours: 4, title: "Group: Community Assessment OKC", links: ["vac1", "vac2"], sub: "Guest lecture — A. Ochs: Community Mission of SSM (1.5 hr)" },
    { id: "g4", kind: "group", hours: 4, title: "Group: Physician Wellness discussion; Human Trafficking education; Disaster Medicine" },
    { id: "g5", kind: "group", hours: 4, title: "Group: Disparities in Health Care — colorectal screening by ethnicity (Epic SlicerDicer prep)" },
    { id: "g6", kind: "group", hours: 4, title: "Group: Motivational Interviewing, counseling & health literacy topics (prep: “Realistic Approach to Counseling in the Office”)" },
    { id: "g7", kind: "group", hours: 4, title: "Group: Patient Safety; Occ Med / toxin presentations" },
    { id: "g8", kind: "group", hours: 4, title: "Group: Community Assessment & Resource reports; free clinics & missions medicine" },
    { id: "kar", kind: "facspecial", hours: 2, faculty: "KAR", title: "Group: Community Medicine Impact in Rural Health — Dr. K. Ray (2 hr)" },
    { id: "skb", kind: "facspecial", hours: 2, faculty: "SKB", title: "Group: Genogram of home-visit patient; family dynamics — Dr. Beach (2 hr)", prefFriday: true },
    { id: "school", kind: "allres", hours: 3, title: "Skyline Middle School — school teaching presentation (Feisal Mahdi, faculty contact) (3 hr)", prefAM: true },
    { id: "ksa", kind: "togetherpref", hours: 4, title: "ABFM KSA: Health Counseling & Preventive Care (print certificate — graduation points)" },
    { id: "om1", kind: "per", hours: 4, occmed: true, title: "Occupational Medicine I (precepting w/ Dr. Estep)" },
    { id: "om2", kind: "per", hours: 4, occmed: true, title: "Occupational Medicine II (precepting w/ Dr. Estep)" },
    { id: "disaster", kind: "per", hours: 4, title: "Disaster Modules (see Curriculum B.7)" },
    { id: "atsdr", kind: "per", hours: 2, title: "Occ Med: ATSDR module; start toxicology presentation — print post-test & topic summary for portfolio (2 hr)" },
    { id: "amamod", kind: "per", hours: 2, title: "AMA module: “Stress First Aid” — complete quiz, print score for portfolio (2 hr)", links: ["ama"] },
    { id: "stfm", kind: "per", hours: 4, title: "STFM Advocacy Modules (2 hr) + Home Visit or Community Resource visit (2 hr)", prefLate: true },
    { id: "wellness", kind: "per", hours: 4, title: "Personal wellness appointment", prefShared: true },
    { id: "wrap", kind: "group-nofac", hours: 4, title: "Independent Study — wrap up assignments, modules & portfolio (submit portfolio)", lockedTo: "last" },
    { id: "fmc_cr", kind: "fmclabel", hours: 0, title: "FMC — Community Resources" },
    { id: "fmc_us", kind: "fmclabel", hours: 0, title: "FMC — USPSTF" },
    { id: "fmc_co", kind: "fmclabel", hours: 0, title: "FMC — Counseling" },
    { id: "fmc_hl", kind: "fmclabel", hours: 0, title: "FMC — Health Literacy" },
    { id: "is", kind: "filler", hours: 0, title: "Independent Study" },
  ];
  const DEF = Object.fromEntries(DEFS.map((d) => [d.id, d]));

  /* ---------------- scheduler ---------------- */
  function generate(model, picks) {
    const A = [];
    let nextId = 1;
    const load = {};    // name|slotKey -> hours
    const occ = {};     // slotKey -> resident (occ med)
    const getLoad = (r, k) => load[r + "|" + k] || 0;
    const bump = (r, k, h) => { load[r + "|" + k] = getLoad(r, k) + h; };
    const canTake = (r, slot, h) => !slot.locked && !residentBusy(model, r, slot.key) && getLoad(r, slot.key) + h <= 4;
    const freeAll = (slot, h) => picks.every((r) => canTake(r, slot, h));
    const place = (defId, resident, slot, extra) => {
      const a = Object.assign({ id: "a" + nextId++, defId, resident, slotKey: slot ? slot.key : null }, extra || {});
      A.push(a);
      if (slot && DEF[defId].hours > 0) {
        const who = resident === "ALL" ? picks : [resident];
        who.forEach((r) => bump(r, slot.key, DEF[defId].hours));
        if (DEF[defId].occmed) occ[slot.key] = resident;
      }
      return a;
    };
    const slots = model.slots.filter((s) => !s.locked);

    // 1. First half-day: group session #1 (forced; warnings surface any conflict)
    const first = slots[0];
    place("g1", "ALL", first);
    picks.forEach((r) => { load[r + "|" + first.key] = 4; }); // saturate even if busy

    // 2. Last half-day: independent-study wrap-up (forced)
    const last = slots[slots.length - 1];
    place("wrap", "ALL", last);
    picks.forEach((r) => { load[r + "|" + last.key] = 4; });

    // 3. Reserve group-eligible slots (all residents + BSC free) before placing specials
    const NEED_GROUPS = 7; // g2..g8
    const gset = () => new Set(slots.filter((s) => freeAll(s, 4) && bscFree(model, s.key)).map((s) => s.key));
    let G = gset();
    let spare = G.size - NEED_GROUPS;
    const takeSpecial = (defId, cands, scoreFn, hours, onPlaced) => {
      let pool = cands;
      if (spare <= 0) pool = cands.filter((s) => !G.has(s.key));
      pool = pool.slice().sort((a, b) => (scoreFn(b) - scoreFn(a)) || a.key.localeCompare(b.key));
      const pick = pool[0] || null;
      if (pick) {
        if (G.has(pick.key)) spare--;
        place(defId, "ALL", pick);
        if (onPlaced) onPlaced(pick);
      } else place(defId, "ALL", null);
      G = gset(); // refresh after load changes
      return pick;
    };

    // SKB (2 hr) — Friday preferred, later in the block preferred (home visits done first)
    takeSpecial("skb",
      slots.filter((s) => freeAll(s, 2) && facFree(model, "SKB", s.key)),
      (s) => (s.dow === 4 ? 100 : 0) + s.week * 5 + (G.has(s.key) ? 0 : 4), 2);

    // KAR (2 hr) — prefer a slot with a full 4 h free so the ATSDR module can follow (as in the sample)
    takeSpecial("kar",
      slots.filter((s) => freeAll(s, 2) && facFree(model, "KAR", s.key)),
      (s) => (freeAll(s, 4) ? 50 : 0) + (G.has(s.key) ? 0 : 100) - s.week, 2,
      (pick) => { picks.forEach((r) => { if (canTake(r, pick, 2)) place("atsdr", r, pick); }); });

    // School (3 hr, all residents, AM preferred)
    takeSpecial("school",
      slots.filter((s) => freeAll(s, 3)),
      (s) => (s.ampm === "AM" ? 100 : 0) + (G.has(s.key) ? 0 : 50) - s.week, 3);

    // ABFM KSA — together if possible
    {
      const cands = slots.filter((s) => freeAll(s, 4));
      let pool = spare <= 0 ? cands.filter((s) => !G.has(s.key)) : cands;
      pool = pool.slice().sort((a, b) => (((G.has(a.key) ? 0 : 50) - (G.has(b.key) ? 0 : 50)) * -1) || a.key.localeCompare(b.key));
      if (pool[0]) { if (G.has(pool[0].key)) spare--; place("ksa", "ALL", pool[0], { together: true }); G = gset(); }
      else picks.forEach((r) => {
        const s2 = slots.find((s) => !G.has(s.key) && canTake(r, s, 4)) || slots.find((s) => canTake(r, s, 4));
        if (s2) place("ksa", r, s2, { together: false }); else place("ksa", r, null, { together: false });
      });
    }

    // 4. Group sessions g2..g8 with BSC, spread across the block
    {
      const cands = slots.filter((s) => freeAll(s, 4) && bscFree(model, s.key));
      const need = ["g2", "g3", "g4", "g5", "g6", "g7", "g8"];
      let chosen = [];
      if (cands.length <= need.length) chosen = cands.slice();
      else {
        const idx = new Set();
        for (let i = 0; i < need.length; i++) idx.add(Math.round((i * (cands.length - 1)) / (need.length - 1)));
        chosen = [...idx].sort((a, b) => a - b).map((i) => cands[i]);
        let p = 0;
        while (chosen.length < need.length && p < cands.length) { if (!chosen.includes(cands[p])) chosen.push(cands[p]); p++; }
        chosen.sort((a, b) => a.key.localeCompare(b.key));
      }
      need.forEach((g, i) => { if (chosen[i]) place(g, "ALL", chosen[i]); else place(g, "ALL", null); });
    }

    // 5. Occ Med I & II — one resident per half-day, I earlier / II later, avoid group-eligible slots
    picks.forEach((r) => {
      const findOM = (weeksPref) => {
        const cand = slots.filter((s) => canTake(r, s, 4) && !occ[s.key]);
        cand.sort((a, b) => {
          const sc = (s) => (weeksPref.includes(s.week) ? 100 : 0) + (G.has(s.key) ? 0 : 10);
          return (sc(b) - sc(a)) || a.key.localeCompare(b.key);
        });
        return cand[0] || null;
      };
      const s1 = findOM([0, 1]); if (s1) place("om1", r, s1); else place("om1", r, null);
      const s2 = findOM([2, 3]); if (s2) place("om2", r, s2); else place("om2", r, null);
    });

    // 6. FMC labels — align all three residents when possible
    {
      const shared = model.slots.filter((s) => !s.locked && picks.every((r) => residentFmcLabelable(model, r, s.key)));
      const usedShared = new Set(); const usedWeeks = new Set();
      ["fmc_cr", "fmc_us", "fmc_co", "fmc_hl"].forEach((lab, li) => {
        const avail = shared.filter((s) => !usedShared.has(s.key));
        const pick = avail.find((s) => !usedWeeks.has(s.week)) || avail[0];
        if (pick) usedWeeks.add(pick.week);
        if (pick) {
          usedShared.add(pick.key);
          place(lab, "ALL", pick, { aligned: true });
        } else {
          picks.forEach((r) => {
            const own = model.slots.filter((s) => !s.locked && residentFmcLabelable(model, r, s.key) && !A.some((a) => DEF[a.defId].kind === "fmclabel" && a.slotKey === s.key && (a.resident === r || a.resident === "ALL")));
            if (own[li] || own[0]) place(lab, r, own[li] || own[0], { aligned: false });
            else place(lab, r, null, { aligned: false });
          });
        }
      });
    }

    // 7. Remaining per-resident modules
    const placeIndiv = (r, defId, scoreFn) => {
      if (A.some((a) => a.defId === defId && (a.resident === r))) return; // already placed (e.g. atsdr with KAR)
      const h = DEF[defId].hours;
      const cand = slots.filter((s) => canTake(r, s, h) && !(DEF[defId].occmed && occ[s.key]));
      const sc = (s) => (scoreFn ? scoreFn(s) : 0) + (G.has(s.key) ? 0 : 5);
      cand.sort((a, b) => (sc(b) - sc(a)) || a.key.localeCompare(b.key));
      if (cand[0]) place(defId, r, cand[0]); else place(defId, r, null);
    };
    // shared wellness preference
    {
      const wcands = slots.filter((s) => freeAll(s, 4));
      const sharedW = wcands.find((s) => !G.has(s.key)) || wcands[0];
      picks.forEach((r) => {
        if (sharedW && canTake(r, sharedW, 4)) place("wellness", r, sharedW);
        else placeIndiv(r, "wellness");
      });
    }
    picks.forEach((r) => {
      placeIndiv(r, "disaster");
      placeIndiv(r, "stfm", (s) => (s.week >= 2 ? 10 : 0) + s.week);
      placeIndiv(r, "atsdr");
      // pair AMA with the resident's ATSDR slot when the half-day has room
      const at = A.find((a) => a.defId === "atsdr" && a.resident === r && a.slotKey);
      const atSlot = at ? model.slots.find((s) => s.key === at.slotKey) : null;
      if (atSlot && canTake(r, atSlot, 2)) place("amamod", r, atSlot);
      else placeIndiv(r, "amamod");
    });

    // 8. Independent-study filler for untouched free half-days
    picks.forEach((r) => {
      slots.forEach((s) => {
        if (getLoad(r, s.key) === 0 && !residentBusy(model, r, s.key)) place("is", r, s);
      });
    });

    return A;
  }

  /* ---------------- warnings ---------------- */
  function computeWarnings(model, picks, assignments) {
    const hard = [], soft = [];
    const slotBy = Object.fromEntries(model.slots.map((s) => [s.key, s]));
    const slotName = (k) => { const s = slotBy[k]; return s ? `${DOWS[s.dow]} ${fmtShort(s.date)} ${s.ampm}` : k; };
    model.issues.forEach((i) => (i.level === "hard" ? hard : soft).push(i.msg));

    const load = {}; const occCount = {};
    for (const a of assignments) {
      const def = DEF[a.defId]; if (!def || !a.slotKey) continue;
      const who = a.resident === "ALL" ? picks : [a.resident];
      who.forEach((r) => { load[r + "|" + a.slotKey] = (load[r + "|" + a.slotKey] || 0) + def.hours; });
      if (def.occmed) occCount[a.slotKey] = (occCount[a.slotKey] || 0) + 1;
    }

    for (const a of assignments) {
      const def = DEF[a.defId]; if (!def) continue;
      if (!a.slotKey) {
        if (def.kind !== "filler") hard.push(`Could not place: ${def.title}${a.resident !== "ALL" ? " (" + a.resident + ")" : ""}. No half-day works — drag it from the tray onto the grid to place it manually.`);
        continue;
      }
      const slot = slotBy[a.slotKey];
      if (!slot) { hard.push(`${def.title} is assigned to a date outside the block.`); continue; }
      if (slot.locked && def.kind !== "filler") hard.push(`${def.title} is on ${slotName(a.slotKey)} — that is ${slot.lockedLabel}; nothing can be scheduled there.`);
      const who = a.resident === "ALL" ? picks : [a.resident];
      if (def.kind === "fmclabel") {
        who.forEach((r) => { if (!residentFmcLabelable(model, r, a.slotKey)) hard.push(`“${def.title}” is on ${slotName(a.slotKey)}, but ${r} is not in FMC clinic then. Move it to one of ${r}’s FMC half-days.`); });
        continue;
      }
      who.forEach((r) => {
        if (residentBusy(model, r, a.slotKey)) hard.push(`${r} is not available ${slotName(a.slotKey)} (${residentBusyText(model, r, a.slotKey)}) but is scheduled for: ${def.title}.`);
      });
      if (def.kind === "group" && !bscFree(model, a.slotKey)) hard.push(`Dr. Carroll (BSC) is not available ${slotName(a.slotKey)} (${facultyActs(model, "BSC", a.slotKey).join(", ") || "?"}) but “${def.title}” is scheduled then.`);
      if (def.faculty && !facFree(model, def.faculty, a.slotKey)) hard.push(`${def.faculty === "KAR" ? "Dr. Ray (KAR)" : "Dr. Beach (SKB)"} is not available ${slotName(a.slotKey)} (${facultyActs(model, def.faculty, a.slotKey).join(", ") || "?"}) but “${def.title}” is scheduled then.`);
    }

    Object.entries(load).forEach(([k, h]) => { if (h > 4) { const [r, sk] = k.split("|"); hard.push(`${r} has ${h} hours of activities on ${slotName(sk)} — more than a half-day holds.`); } });
    Object.entries(occCount).forEach(([sk, n]) => { if (n > 1) hard.push(`${n} residents are on Occupational Medicine ${slotName(sk)} — only 1 resident may precept with Dr. Estep per half-day.`); });

    const open = model.slots.filter((s) => !s.locked);
    const firstKey = open[0] && open[0].key, lastKey = open.length && open[open.length - 1].key;
    if (firstKey && !assignments.some((a) => a.slotKey === firstKey && (DEF[a.defId].kind === "group"))) hard.push(`The very first half-day of the block (${slotName(firstKey)}) must be a group session — none is scheduled there.`);
    if (lastKey && !assignments.some((a) => a.slotKey === lastKey && a.defId === "wrap")) hard.push(`The very last half-day of the block (${slotName(lastKey)}) must be Independent Study wrap-up — it isn’t.`);

    const skbA = assignments.find((a) => a.defId === "skb" && a.slotKey);
    if (skbA && slotBy[skbA.slotKey] && slotBy[skbA.slotKey].dow !== 4) soft.push(`Dr. Beach’s session is on ${slotName(skbA.slotKey)} — it is usually held on a Friday.`);
    const ksaAll = assignments.filter((a) => a.defId === "ksa");
    if (ksaAll.length && !ksaAll.some((a) => a.resident === "ALL" && a.slotKey)) soft.push(`The ABFM KSA module could not be scheduled with all three residents together — it is scheduled individually.`);
    const schoolA = assignments.find((a) => a.defId === "school" && a.slotKey);
    if (schoolA && slotBy[schoolA.slotKey] && slotBy[schoolA.slotKey].ampm === "PM") soft.push(`The Skyline Middle School presentation is in a PM slot — a morning slot is usually best for school visits.`);
    assignments.filter((a) => DEF[a.defId].kind === "fmclabel" && a.aligned === false && a.slotKey).length &&
      soft.push(`Some FMC teaching labels could not be aligned on a shared clinic day — they are attached to individual FMC days instead.`);
    const stfmEarly = assignments.filter((a) => a.defId === "stfm" && a.slotKey && slotBy[a.slotKey] && slotBy[a.slotKey].week < 2);
    stfmEarly.forEach((a) => soft.push(`${a.resident}’s STFM Advocacy + visit half-day is in week ${slotBy[a.slotKey].week + 1} — it is meant for later in the month.`));

    return { hard: [...new Set(hard)], soft: [...new Set(soft)] };
  }

  return { MONTHS, norm, up, lc, iso, fmtShort, fmtLong, DOWS, skey, addDays,
    parseBlockHeader, parseFaculty, parseResidents, buildModel,
    facultyActs, bscFree, facFree, residentBusy, residentBusyText, residentEntries, residentFmcLabelable,
    LINKS, DEFS, DEF, generate, computeWarnings };
});
</script>
<script>/* Community Medicine Scheduler — .docx builder v2: mimics Dr. Carroll's sample schedule wording & layout. UMD. */
(function (root, factory) {
  if (typeof module === "object" && module.exports) module.exports = factory();
  else root.CMDocx = factory();
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";
  const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

  /* ---- low-level OOXML helpers ---- */
  function run(text, o) {
    o = o || {};
    let rpr = "";
    if (o.style) rpr += `<w:rStyle w:val="${o.style}"/>`;
    if (o.b) rpr += "<w:b/>";
    if (o.i) rpr += "<w:i/>";
    if (o.u) rpr += `<w:u w:val="single"/>`;
    if (o.color) rpr += `<w:color w:val="${o.color}"/>`;
    if (o.sz) rpr += `<w:sz w:val="${o.sz}"/><w:szCs w:val="${o.sz}"/>`;
    return `<w:r>${rpr ? "<w:rPr>" + rpr + "</w:rPr>" : ""}<w:t xml:space="preserve">${esc(text)}</w:t></w:r>`;
  }
  function para(runsXml, o) {
    o = o || {};
    let ppr = "";
    if (o.center) ppr += `<w:jc w:val="center"/>`;
    ppr += `<w:spacing w:before="${o.spaceBefore || 0}" w:after="${o.spaceAfter != null ? o.spaceAfter : 20}"/>`;
    if (o.keepNext) ppr += `<w:keepNext/>`;
    return `<w:p><w:pPr>${ppr}</w:pPr>${runsXml}</w:p>`;
  }

  /* Line spec: {t, b, i, small, gray, amber, link:'key'|{u,t}, gap (extra space after), center} */
  function build(ctx) {
    const C = ctx.core, model = ctx.model, picks = ctx.picks, A = ctx.assignments;
    const DEF = C.DEF, LINKS = C.LINKS;
    const rels = [];
    const mkLink = (url, text, small) => {
      const id = "rL" + (rels.length + 1);
      rels.push({ id, url });
      return `<w:hyperlink r:id="${id}">${run(text, { style: "Hyperlink", sz: small ? 15 : 17 })}</w:hyperlink>`;
    };
    const lineXml = (L) => {
      const sz = L.small ? 15 : 18;
      const color = L.gray ? "7F7F7F" : L.color || null;
      let inner = "";
      if (L.link) {
        const lk = typeof L.link === "string" ? LINKS[L.link] : L.link;
        if (L.t) inner = run(L.t, { b: L.b, i: L.i, sz, color }) + mkLink(lk.u, lk.display || lk.t, L.small);
        else inner = mkLink(lk.u, lk.display || lk.t, L.small);
      } else {
        inner = run(L.t || "", { b: L.b, i: L.i, sz, color });
      }
      return para(inner, { spaceAfter: L.gap ? 110 : 20, center: L.center });
    };

    const ampmOf = (key) => key.split("|")[1];
    const AM = (k) => ampmOf(k) === "AM";
    const nice = (names) => (names.length > 1 ? names.slice(0, -1).join(", ") + " & " + names[names.length - 1] : names[0]);

    /* ---- portfolio due date: first Monday after the block ends ---- */
    const end = model.block.end;
    const dow = end.getUTCDay(); // 0 Sun..6 Sat
    const daysToMon = ((8 - dow) % 7) || 7;
    const due = C.addDays(end, daysToMon);
    const dueTxt = `${due.getUTCMonth() + 1}/${due.getUTCDate()}/${String(due.getUTCFullYear()).slice(2)}`;

    /* ---- per-session export text, mimicking the sample schedule ---- */
    function groupLines(defId, key) {
      const am = AM(key);
      switch (defId) {
        case "g1": return [
          { t: "Group Session – Dr. Carroll", b: true },
